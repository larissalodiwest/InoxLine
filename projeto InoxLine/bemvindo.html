<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="Logoinoxline.png" /> 
  <title>InoxLine - Metalúrgica</title>
  <style>
   
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: linear-gradient(135deg, #0b1b2a, #12293f);
      color: #e0e0e0;
    }

    .side-banner {
      flex: 1;
      background: linear-gradient(rgba(10, 20, 35, 0.6), rgba(10, 20, 35, 0.6)),
                  url("Logoinoxline.png") center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      color: #fff;
      text-align: center;
    }

    .side-banner h2 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #f1f1f1;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .side-banner p {
      max-width: 400px;
      font-weight: 300;
      line-height: 1.5;
      color: #cfd8dc;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .login-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1e2f44;
      position: relative;
      overflow: hidden;
    }

    .login-section::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(52, 152, 219, 0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      z-index: 0;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 50px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      z-index: 1;
      backdrop-filter: blur(8px);
      text-align: center; 
    }

    .login-box h1 {
      text-align: center;
      color: #fff;
      font-size: 28px;
      margin-bottom: 40px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .option-button {
      display: block;
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2980b9, #1f5f8b);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 1px;
      cursor: pointer;
      margin-bottom: 20px; 
      transition: 0.3s;
      text-decoration: none; 
      line-height: 1; 
    }

    .option-button:hover {
      background: linear-gradient(135deg, #3498db, #2c6fa3);
      box-shadow: 0 4px 15px rgba(41, 128, 185, 0.4);
    }

   
    .option-button i {
        margin-right: 10px;
    }

  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <div class="side-banner">
    <h2>InoxLine Metalúrgica</h2>
    <p>Excelência em processos e qualidade certificada. 
      Acesse o sistema de auditoria e mantenha os padrões de qualidade InoxLine.</p>
  </div>

  <div class="login-section">
    <div class="login-box">
      <h1>Bem-vindo!</h1>
      <p style="margin-bottom: 30px; color: #b0bec5;">Selecione seu perfil de acesso:</p>

      <a href="adminlogin.html" class="option-button">
        <i class="fas fa-user-shield"></i> ADMINISTRADOR
      </a>

      <a href="funclogin.html" class="option-button">
        <i class="fas fa-user-tag"></i> FUNCIONÁRIO
      </a>

    </div>
  </div>
</body>
</html>
